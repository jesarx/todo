{{define "content"}}
<div class="login">
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
    <rect x="20" y="20" width="60" height="60" rx="16" fill="none" stroke="#4CD3A5" stroke-width="6" opacity=".35"/>
    <path d="M31 51 L45 65 L73 31" fill="none" stroke="#4CD3A5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>todo</h1>
  {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Contraseña" autofocus autocomplete="current-password" required>
    <button type="submit" class="btn primary">Entrar</button>
  </form>
</div>
{{end}}
