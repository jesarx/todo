<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<meta name="color-scheme" content="dark">
<title>{{if .Title}}{{.Title}} · todo{{else}}todo{{end}}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
<div id="syncbar" hidden></div>
{{if .Nav}}
<header class="top">
  <a class="brand" href="/" aria-label="Inicio">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="20" y="20" width="60" height="60" rx="16" fill="none" stroke="currentColor" stroke-width="7" opacity=".35"/>
      <path d="M31 51 L45 65 L73 31" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>todo</span>
  </a>
  <nav class="topnav">
    <a href="/todas" class="{{if eq .Nav "todas"}}on{{end}}">Todas</a>
    <a href="/buscar" class="{{if eq .Nav "buscar"}}on{{end}}">Buscar</a>
    <a href="/ajustes" class="{{if eq .Nav "ajustes"}}on{{end}}">Ajustes</a>
  </nav>
</header>
{{end}}
<main{{if .Wide}} class="wide"{{end}}>
{{template "content" .}}
</main>
<script src="/static/app.js?v={{v}}"></script>
</body>
</html>
